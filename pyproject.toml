[project]
name = "molweave-dev"
version = "0.1.0"
description = "MolWeave local development environment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.6,<4.10",
  "fastapi>=0.115,<0.120",
  "gemmi==0.7.5",
  "httpx>=0.28,<1",
  "numpy>=2.3,<2.5",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "rdkit==2026.3.4",
  "sqlalchemy>=2.0,<3",
  "uuid6>=2024.7.10",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "uv>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["apps/api/src", "packages/molweave_core/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["apps/api/src", "packages/molweave_core/src"]
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^apps/web/"]

[[tool.mypy.overrides]]
module = ["gemmi", "rdkit", "rdkit.*", "uuid6"]
ignore_missing_imports = true
